name: Compile

on:
  - pull_request
  - push

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.12.x

      - run: opam install ledgerwallet ledgerwallet-mavryk ledgerwallet-ssh-agent ledgerwallet-zil --deps-only --with-test

      - run: opam exec -- dune build -p ledgerwallet,ledgerwallet-mavryk,ledgerwallet-ssh-agent,ledgerwallet-zil
